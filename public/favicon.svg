<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <linearGradient id="bagGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4f93"/>
      <stop offset="100%" stop-color="#d81b60"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#d81b60" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Bag handle -->
  <path
    d="M82 72 C82 38 138 38 138 72"
    fill="none"
    stroke="#e91e63"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Speed lines -->
  <path d="M38 104 H68" stroke="#ff4f93" stroke-width="9" stroke-linecap="round"/>
  <path d="M28 122 H68" stroke="#ff4f93" stroke-width="9" stroke-linecap="round"/>
  <path d="M44 140 H68" stroke="#ff4f93" stroke-width="9" stroke-linecap="round"/>

  <!-- Bag body -->
  <path
    d="M62 72 H158 C165 72 170 78 171 85 L184 170 C186 184 176 194 162 194 H58 C44 194 34 184 36 170 L49 85 C50 78 55 72 62 72 Z"
    fill="url(#bagGradient)"
    filter="url(#shadow)"
  />

  <!-- Right side fold -->
  <path
    d="M154 76 L184 170 C187 184 176 194 162 194 H142 L154 76 Z"
    fill="#b91552"
    opacity="0.35"
  />

  <!-- Letter a -->
  <text
    x="102"
    y="154"
    text-anchor="middle"
    font-size="104"
    fill="white"
    font-family="Georgia, serif"
    font-weight="700"
  >
    a
  </text>

  <!-- Sparkle -->
  <path
    d="M184 72 L190 86 L204 92 L190 98 L184 112 L178 98 L164 92 L178 86 Z"
    fill="#ff4f93"
  />
</svg>
